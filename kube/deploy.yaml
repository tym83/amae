# Taintednetes inside the cluster it schedules: the scheduler, the parting
# operator and counsel, compiled from Tainted into ghcr.io/tym83/tainted,
# run as pods.
#
#   kubectl --context <ctx> create namespace taintednetes
#   kubectl --context <ctx> apply -f kube/deploy.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: taintednetes-kubeconfig
  namespace: taintednetes
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: here
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: me
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: in-cluster
        context: {cluster: here, user: me}
    current-context: in-cluster
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scheduler
  namespace: taintednetes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: parting
  namespace: taintednetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: taintednetes-scheduler
rules:
  - apiGroups: [""]
    resources: [pods, nodes, namespaces]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [bindings, pods/binding]
    verbs: [create]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  # Trust in nodes, from the relationships counsel keeps.
  - apiGroups: [tainted.io]
    resources: [relationships]
    verbs: [get, list]
  # Preemption: letting pods of lower priority go, and promising the node.
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: taintednetes-scheduler
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: taintednetes-scheduler}
subjects:
  - {kind: ServiceAccount, name: scheduler, namespace: taintednetes}
---
# The lease through which the copies of the scheduler agree who binds.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: taintednetes-scheduler-lease
  namespace: taintednetes
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [taintednetes]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: taintednetes-scheduler-lease
  namespace: taintednetes
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: taintednetes-scheduler-lease}
subjects:
  - {kind: ServiceAccount, name: scheduler, namespace: taintednetes}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: taintednetes-parting
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: taintednetes-parting
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: taintednetes-parting}
subjects:
  - {kind: ServiceAccount, name: parting, namespace: taintednetes}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: taintednetes
spec:
  # Two copies: the one holding the lease binds, the other waits to take over.
  replicas: 2
  selector:
    matchLabels: {app: taintednetes-scheduler}
  template:
    metadata:
      labels: {app: taintednetes-scheduler}
    spec:
      serviceAccountName: scheduler
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: taintednetes-scheduler}
      containers:
        - name: scheduler
          image: ghcr.io/tym83/tainted:latest
          imagePullPolicy: Always
          # A scheduler lives as long as its cluster: no patience limit.
          command: [/opt/tainted/bin/taintednetes, --patience=0]
          env:
            - {name: KUBECONFIG, value: /etc/taintednetes/config}
            - {name: KUBE_CONTEXT, value: in-cluster}
            - {name: TAINTEDNETES_INTERVAL, value: "5"}
            - {name: TAINTEDNETES_LEASE, value: taintednetes/taintednetes}
            - name: HOSTNAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: HOME, value: /tmp}
          volumeMounts:
            - {name: kubeconfig, mountPath: /etc/taintednetes}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
      volumes:
        - name: kubeconfig
          configMap: {name: taintednetes-kubeconfig}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parting
  namespace: taintednetes
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: taintednetes-parting}
  template:
    metadata:
      labels: {app: taintednetes-parting}
    spec:
      serviceAccountName: parting
      containers:
        - name: parting
          image: ghcr.io/tym83/tainted:latest
          imagePullPolicy: Always
          command: [/opt/tainted/bin/parting, --patience=0]
          env:
            - {name: KUBECONFIG, value: /etc/taintednetes/config}
            - {name: KUBE_CONTEXT, value: in-cluster}
            - {name: PARTING_INTERVAL, value: "5"}
            - {name: HOME, value: /tmp}
          volumeMounts:
            - {name: kubeconfig, mountPath: /etc/taintednetes}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
      volumes:
        - name: kubeconfig
          configMap: {name: taintednetes-kubeconfig}
---
# What a workload and a node have lived through together, kept by counsel.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: relationships.tainted.io
spec:
  group: tainted.io
  scope: Namespaced
  names: {plural: relationships, singular: relationship, kind: Relationship, shortNames: [rel]}
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - {name: Partner, type: string, jsonPath: .spec.partner.name}
        - {name: Node, type: string, jsonPath: .spec.node}
        - {name: Health, type: string, jsonPath: .status.health}
        - {name: Ratio, type: string, jsonPath: .status.ratio}
        - {name: Scars, type: integer, jsonPath: .status.scars}
        - {name: Seen, type: date, jsonPath: .status.lastSeen}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [partner, node]
              properties:
                partner:
                  type: object
                  properties:
                    kind: {type: string}
                    name: {type: string}
                node: {type: string}
            status:
              type: object
              properties:
                positive: {type: number}
                criticism: {type: number}
                contempt: {type: number}
                defensiveness: {type: number}
                stonewalling: {type: number}
                scars: {type: integer}
                ratio: {type: string}
                health: {type: string, enum: [stable, at risk, failing]}
                lastSeen: {type: string, format: date-time}
                history:
                  type: array
                  items:
                    type: object
                    properties:
                      at: {type: string}
                      what: {type: string}
                pods:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: counsel
  namespace: taintednetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: taintednetes-counsel
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [tainted.io]
    resources: [relationships]
    verbs: [get, list, create, update]
  # Divorce: a pod parts from its node by eviction, and is told why.
  - apiGroups: [""]
    resources: [pods/eviction, events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: taintednetes-counsel
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: taintednetes-counsel}
subjects:
  - {kind: ServiceAccount, name: counsel, namespace: taintednetes}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: counsel
  namespace: taintednetes
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: taintednetes-counsel}
  template:
    metadata:
      labels: {app: taintednetes-counsel}
    spec:
      serviceAccountName: counsel
      containers:
        - name: counsel
          image: ghcr.io/tym83/tainted:latest
          imagePullPolicy: Always
          command: [/opt/tainted/bin/counsel, --patience=0]
          env:
            - {name: KUBECONFIG, value: /etc/taintednetes/config}
            - {name: KUBE_CONTEXT, value: in-cluster}
            - {name: COUNSEL_INTERVAL, value: "10"}
            - {name: COUNSEL_DIVORCE, value: "1"}
            - {name: HOME, value: /tmp}
          volumeMounts:
            - {name: kubeconfig, mountPath: /etc/taintednetes}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
      volumes:
        - name: kubeconfig
          configMap: {name: taintednetes-kubeconfig}
