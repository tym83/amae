# Amaenetes inside the cluster it schedules: the scheduler, the parting
# operator, counsel and mediator, compiled from Amae into ghcr.io/tym83/amae,
# run as pods.
#
#   kubectl --context <ctx> create namespace amaenetes
#   kubectl --context <ctx> apply -f kube/deploy.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: amaenetes-kubeconfig
  namespace: amaenetes
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: here
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: me
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: in-cluster
        context: {cluster: here, user: me}
    current-context: in-cluster
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scheduler
  namespace: amaenetes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: parting
  namespace: amaenetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amaenetes-scheduler
rules:
  - apiGroups: [""]
    resources: [pods, nodes, namespaces]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [bindings, pods/binding]
    verbs: [create]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  # Trust in nodes, from the relationships counsel keeps.
  - apiGroups: [amae.io]
    resources: [relationships]
    verbs: [get, list]
  # Preemption: letting pods of lower priority go, and promising the node.
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amaenetes-scheduler
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: amaenetes-scheduler}
subjects:
  - {kind: ServiceAccount, name: scheduler, namespace: amaenetes}
---
# The lease through which the copies of the scheduler agree who binds.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: amaenetes-scheduler-lease
  namespace: amaenetes
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [amaenetes]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: amaenetes-scheduler-lease
  namespace: amaenetes
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: amaenetes-scheduler-lease}
subjects:
  - {kind: ServiceAccount, name: scheduler, namespace: amaenetes}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amaenetes-parting
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amaenetes-parting
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: amaenetes-parting}
subjects:
  - {kind: ServiceAccount, name: parting, namespace: amaenetes}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: amaenetes
spec:
  # Two copies: the one holding the lease binds, the other waits to take over.
  replicas: 2
  selector:
    matchLabels: {app: amaenetes-scheduler}
  template:
    metadata:
      labels: {app: amaenetes-scheduler}
    spec:
      serviceAccountName: scheduler
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: amaenetes-scheduler}
      containers:
        - name: scheduler
          image: ghcr.io/tym83/amae:latest
          imagePullPolicy: Always
          # A scheduler lives as long as its cluster: no patience limit.
          command: [/opt/amae/bin/amaenetes, --patience=0]
          env:
            - {name: KUBECONFIG, value: /etc/amaenetes/config}
            - {name: KUBE_CONTEXT, value: in-cluster}
            - {name: AMAENETES_INTERVAL, value: "5"}
            - {name: AMAENETES_LEASE, value: amaenetes/amaenetes}
            - name: HOSTNAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: HOME, value: /tmp}
          volumeMounts:
            - {name: kubeconfig, mountPath: /etc/amaenetes}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
      volumes:
        - name: kubeconfig
          configMap: {name: amaenetes-kubeconfig}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parting
  namespace: amaenetes
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: amaenetes-parting}
  template:
    metadata:
      labels: {app: amaenetes-parting}
    spec:
      serviceAccountName: parting
      containers:
        - name: parting
          image: ghcr.io/tym83/amae:latest
          imagePullPolicy: Always
          command: [/opt/amae/bin/parting, --patience=0]
          env:
            - {name: KUBECONFIG, value: /etc/amaenetes/config}
            - {name: KUBE_CONTEXT, value: in-cluster}
            - {name: PARTING_INTERVAL, value: "5"}
            - {name: HOME, value: /tmp}
          volumeMounts:
            - {name: kubeconfig, mountPath: /etc/amaenetes}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
      volumes:
        - name: kubeconfig
          configMap: {name: amaenetes-kubeconfig}
---
# What a workload and a node have lived through together, kept by counsel.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: relationships.amae.io
spec:
  group: amae.io
  scope: Namespaced
  names: {plural: relationships, singular: relationship, kind: Relationship, shortNames: [rel]}
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - {name: Partner, type: string, jsonPath: .spec.partner.name}
        - {name: Node, type: string, jsonPath: .spec.node}
        - {name: Resolution, type: string, jsonPath: .status.resolution}
        - {name: Health, type: string, jsonPath: .status.health}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Ratio, type: string, jsonPath: .status.ratio}
        - {name: Towards, type: integer, jsonPath: .status.turning}
        - {name: Scars, type: integer, jsonPath: .status.scars}
        - {name: Seen, type: date, jsonPath: .status.lastSeen}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              anyOf:
                - required: [partner, node]
                - required: [kind, between, over]
                  properties:
                    kind: {enum: [quarrel]}
              properties:
                kind: {type: string}
                between:
                  type: array
                  items: {type: string}
                over: {type: string}
                partner:
                  type: object
                  properties:
                    kind: {type: string}
                    name: {type: string}
                node: {type: string}
            status:
              type: object
              properties:
                resolution: {type: string, enum: [open, consent, yielded, parted]}
                swaps: {type: integer}
                owner: {type: string}
                phase: {type: string, enum: [lust, attraction, attachment]}
                language: {type: string, enum: ["", words, time, gifts, service, touch]}
                spokenLanguages:
                  type: array
                  items: {type: string}
                positive: {type: number}
                criticism: {type: number}
                contempt: {type: number}
                defensiveness: {type: number}
                stonewalling: {type: number}
                bids: {type: number}
                towards: {type: number}
                away: {type: number}
                against: {type: number}
                turning: {type: integer}
                scars: {type: integer}
                ratio: {type: string}
                health: {type: string, enum: [stable, at risk, failing]}
                lastSeen: {type: string, format: date-time}
                history:
                  type: array
                  items:
                    type: object
                    properties:
                      at: {type: string}
                      what: {type: string}
                pods:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: counsel
  namespace: amaenetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amaenetes-counsel
rules:
  - apiGroups: [""]
    resources: [pods, nodes, namespaces]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
  - apiGroups: [amae.io]
    resources: [relationships]
    verbs: [get, list, create, update]
  # Divorce: a pod parts from its node by eviction, and is told why.
  - apiGroups: [""]
    resources: [pods/eviction, events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amaenetes-counsel
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: amaenetes-counsel}
subjects:
  - {kind: ServiceAccount, name: counsel, namespace: amaenetes}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: counsel
  namespace: amaenetes
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: amaenetes-counsel}
  template:
    metadata:
      labels: {app: amaenetes-counsel}
    spec:
      serviceAccountName: counsel
      containers:
        - name: counsel
          image: ghcr.io/tym83/amae:latest
          imagePullPolicy: Always
          command: [/opt/amae/bin/counsel, --patience=0]
          env:
            - {name: KUBECONFIG, value: /etc/amaenetes/config}
            - {name: KUBE_CONTEXT, value: in-cluster}
            - {name: COUNSEL_INTERVAL, value: "10"}
            - {name: COUNSEL_DIVORCE, value: "1"}
            - {name: HOME, value: /tmp}
          volumeMounts:
            - {name: kubeconfig, mountPath: /etc/amaenetes}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
      volumes:
        - name: kubeconfig
          configMap: {name: amaenetes-kubeconfig}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mediator
  namespace: amaenetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amaenetes-mediator
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, patch]
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [get, list, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [amae.io]
    resources: [relationships, relationships/status]
    verbs: [get, list, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amaenetes-mediator
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: amaenetes-mediator}
subjects:
  - {kind: ServiceAccount, name: mediator, namespace: amaenetes}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amaenetes-mediator
  namespace: amaenetes
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: amaenetes-mediator}
  template:
    metadata:
      labels: {app: amaenetes-mediator}
    spec:
      serviceAccountName: mediator
      containers:
        - name: mediator
          image: ghcr.io/tym83/amae:latest
          imagePullPolicy: Always
          command: [/opt/amae/bin/mediator, --patience=0]
          env:
            - {name: KUBECONFIG, value: /etc/amaenetes/config}
            - {name: KUBE_CONTEXT, value: in-cluster}
            - {name: MEDIATOR_INTERVAL, value: "10"}
            - {name: HOME, value: /tmp}
          volumeMounts:
            - {name: kubeconfig, mountPath: /etc/amaenetes}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
      volumes:
        - name: kubeconfig
          configMap: {name: amaenetes-kubeconfig}
