# Requires amaenetes and amaenetes-kubeconfig from kube/deploy.yaml.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: issuers.acme.amae.io
spec:
  group: acme.amae.io
  scope: Namespaced
  names: {plural: issuers, singular: issuer, kind: Issuer}
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: State, type: string, jsonPath: .status.state}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [acme]
              properties:
                acme:
                  type: object
                  required: [server, email, privateKeySecretRef, solvers]
                  properties:
                    server: {type: string, pattern: '^https?://'}
                    email: {type: string, minLength: 3}
                    privateKeySecretRef:
                      type: object
                      required: [name]
                      properties:
                        name: {type: string, maxLength: 63, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
                    skipTLSVerify: {type: boolean, default: false}
                    solvers:
                      type: array
                      minItems: 1
                      maxItems: 1
                      items:
                        type: object
                        required: [http01]
                        properties:
                          http01:
                            type: object
                            properties:
                              standalone: {type: boolean, enum: [true], default: true}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificates.acme.amae.io
spec:
  group: acme.amae.io
  scope: Namespaced
  names: {plural: certificates, singular: certificate, kind: Certificate}
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: State, type: string, jsonPath: .status.state}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
        - {name: Ready, type: string, jsonPath: '.status.conditions[?(@.type=="Ready")].status'}
        - {name: Expires, type: string, jsonPath: .status.notAfter}
        - {name: Renewal, type: string, jsonPath: .status.renewalTime}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [secretName, dnsNames, issuerRef]
              properties:
                secretName: {type: string, maxLength: 63, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
                dnsNames:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: {type: string, maxLength: 253, pattern: '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$'}
                issuerRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string, maxLength: 63, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
                    kind: {type: string, enum: [Issuer], default: Issuer}
                    group: {type: string, enum: [acme.amae.io], default: acme.amae.io}
                renewBefore: {type: string, pattern: '^[0-9]+[smhd]$', default: 720h}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: orders.acme.amae.io
spec:
  group: acme.amae.io
  scope: Namespaced
  names: {plural: orders, singular: order, kind: Order}
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: State, type: string, jsonPath: .status.state}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [dnsNames, issuerRef]
              properties:
                dnsNames:
                  type: array
                  items: {type: string}
                issuerRef:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: challenges.acme.amae.io
spec:
  group: acme.amae.io
  scope: Namespaced
  names: {plural: challenges, singular: challenge, kind: Challenge}
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: State, type: string, jsonPath: .status.state}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [url, authorizationURL, token, dnsName, keyAuthorization]
              properties:
                url: {type: string}
                authorizationURL: {type: string}
                token: {type: string, pattern: '^[A-Za-z0-9_-]+$'}
                dnsName: {type: string}
                keyAuthorization: {type: string}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: acme, namespace: amaenetes}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: amaenetes-acme}
rules:
  - apiGroups: [acme.amae.io]
    resources: [issuers, certificates, orders, challenges]
    verbs: [get, list, create, patch]
  - apiGroups: [acme.amae.io]
    resources: [issuers/status, certificates/status, orders/status, challenges/status]
    verbs: [get, patch]
  - apiGroups: ['']
    resources: [secrets, configmaps, services]
    verbs: [get, create, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, patch]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [acme]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: amaenetes-acme}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: amaenetes-acme}
subjects:
  - {kind: ServiceAccount, name: acme, namespace: amaenetes}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: amaenetes-acme, namespace: amaenetes}
spec:
  replicas: 1
  selector:
    matchLabels: {app: amaenetes-acme}
  template:
    metadata:
      labels: {app: amaenetes-acme}
    spec:
      serviceAccountName: acme
      containers:
        - name: acme
          image: ghcr.io/tym83/amae:latest
          imagePullPolicy: Always
          command: [/opt/amae/bin/acme, --patience=0]
          env:
            - {name: KUBECONFIG, value: /etc/amaenetes/config}
            - {name: KUBE_CONTEXT, value: in-cluster}
            - {name: HOME, value: /tmp}
          volumeMounts:
            - {name: kubeconfig, mountPath: /etc/amaenetes}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
      volumes:
        - name: kubeconfig
          configMap: {name: amaenetes-kubeconfig}
