# Stand storage is ephemeral: do not use this manifest as a backup strategy.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusters.postgres.amae.io
spec:
  group: postgres.amae.io
  scope: Namespaced
  names: {plural: clusters, singular: cluster, kind: Cluster, shortNames: [apg]}
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Primary, type: string, jsonPath: .status.currentPrimary}
        - {name: Target, type: string, jsonPath: .status.targetPrimary}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [instances, image]
              properties:
                instances: {type: integer, minimum: 2, maximum: 3}
                image:
                  type: string
                  pattern: '^postgres:17\.[0-9]+-bookworm(@sha256:[a-f0-9]{64})?$'
                storage: {type: string, enum: [emptyDir], default: emptyDir}
            status:
              type: object
              properties:
                phase: {type: string}
                phaseStartedAt: {type: string, format: date-time}
                currentPrimary: {type: string}
                targetPrimary: {type: string}
                targetUID: {type: string}
                targetLSN: {type: string}
                oldPrimary: {type: string}
                requestedPrimary: {type: string}
                operation: {type: string}
                barrierLSN: {type: string}
                fenceConfirmed: {type: integer, enum: [0, 1]}
                unhealthySince: {type: integer, format: int64}
                instances:
                  type: array
                  items:
                    type: object
                    required: [name, role, ready, lag]
                    properties:
                      name: {type: string}
                      uid: {type: string}
                      role: {type: string}
                      ready: {type: integer, enum: [0, 1]}
                      lag: {type: integer, format: int64}
                      receivedLSN: {type: string}
                      replayedLSN: {type: string}
                      flushLSN: {type: string}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ['True', 'False', Unknown]}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: postgres, namespace: amaenetes}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: amaenetes-postgres}
rules:
  - apiGroups: [postgres.amae.io]
    resources: [clusters, clusters/status]
    verbs: [get, list, patch]
  - apiGroups: [postgres.amae.io]
    resources: [clusters/finalizers]
    verbs: [update]
  - apiGroups: ['']
    resources: [pods, secrets, services]
    verbs: [get, list, create, patch, delete]
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: amaenetes-postgres}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: amaenetes-postgres}
subjects:
  - {kind: ServiceAccount, name: postgres, namespace: amaenetes}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: postgres, namespace: amaenetes}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [postgres]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: postgres, namespace: amaenetes}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: postgres}
subjects:
  - {kind: ServiceAccount, name: postgres, namespace: amaenetes}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: amaenetes-postgres, namespace: amaenetes}
spec:
  replicas: 1
  selector:
    matchLabels: {app: amaenetes-postgres}
  template:
    metadata:
      labels: {app: amaenetes-postgres}
    spec:
      serviceAccountName: postgres
      containers:
        - name: postgres
          image: ghcr.io/tym83/amae:latest
          imagePullPolicy: Always
          command: [/opt/amae/bin/postgres, --patience=0]
          env:
            - {name: KUBECONFIG, value: /etc/amaenetes/config}
            - {name: KUBE_CONTEXT, value: in-cluster}
            - {name: PG_FAILOVER_DELAY, value: '10'}
            - {name: PG_LEASE_NAMESPACE, value: amaenetes}
            - {name: HOME, value: /tmp}
          volumeMounts:
            - {name: kubeconfig, mountPath: /etc/amaenetes, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
      volumes:
        - name: kubeconfig
          configMap: {name: amaenetes-kubeconfig}
