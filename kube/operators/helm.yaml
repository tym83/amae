# One controller per target namespace; change all helm-e2e namespace references
# together. ClusterRole is bound only inside that namespace, including Helm's
# chart permissions. Cluster-scoped chart resources are deliberately unsupported.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmreleases.helm.amae.io
spec:
  group: helm.amae.io
  scope: Namespaced
  names: {plural: helmreleases, singular: helmrelease, kind: HelmRelease}
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [chart]
              properties:
                chart:
                  type: object
                  properties:
                    repository: {type: string, pattern: '^https?://'}
                    name: {type: string, minLength: 1, pattern: '^[A-Za-z0-9]'}
                    version: {type: string, minLength: 1, pattern: '^[A-Za-z0-9]'}
                    oci: {type: string, pattern: '^oci://'}
                    path: {type: string, pattern: '^[/]|^[.]/'}
                  oneOf:
                    - required: [repository, name, version]
                      not:
                        anyOf:
                          - required: [oci]
                          - required: [path]
                    - required: [oci]
                      not:
                        anyOf:
                          - required: [repository]
                          - required: [path]
                    - required: [path]
                      not:
                        anyOf:
                          - required: [repository]
                          - required: [oci]
                values:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                interval: {type: integer, minimum: 1, default: 30}
                timeout: {type: integer, minimum: 1, maximum: 3600, default: 300}
                install:
                  type: object
                  properties:
                    remediation:
                      type: object
                      properties:
                        retries: {type: integer, minimum: 0, maximum: 10, default: 0}
                upgrade:
                  type: object
                  properties:
                    remediation:
                      type: object
                      properties:
                        retries: {type: integer, minimum: 0, maximum: 10, default: 0}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                lastHandledReconcileAt: {type: string}
                lastAttemptedRevision: {type: string}
                failures: {type: integer, minimum: 0}
                installFailures: {type: integer, minimum: 0}
                upgradeFailures: {type: integer, minimum: 0}
                history:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ['True', 'False', Unknown]}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: helm, namespace: helm-e2e}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: amaenetes-helm}
rules:
  # Helm stores release Secrets and manages arbitrary namespaced chart resources.
  # RoleBinding below confines these rights to the target namespace.
  - apiGroups: ['*']
    resources: ['*']
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: amaenetes-helm, namespace: helm-e2e}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: amaenetes-helm}
subjects:
  - {kind: ServiceAccount, name: helm, namespace: helm-e2e}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: amaenetes-helm, namespace: helm-e2e}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: amaenetes-helm}
  template:
    metadata:
      labels: {app: amaenetes-helm}
    spec:
      serviceAccountName: helm
      containers:
        - name: helm
          image: ghcr.io/tym83/amae:latest
          imagePullPolicy: Always
          command: [/opt/amae/bin/helm-controller, --patience=0]
          env:
            - name: HELM_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - {name: HOME, value: /tmp}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
