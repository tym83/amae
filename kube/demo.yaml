# Pods for taintednetes to place. NODE_A and NODE_B stand for two of your nodes:
#   kubectl --context <ctx> create namespace <ns>
#   sed -e s/NODE_A/<node>/ -e s/NODE_B/<node>/ kube/demo.yaml \
#     | kubectl --context <ctx> -n <ns> apply -f -
apiVersion: v1
kind: Pod
metadata:
  name: web
  annotations:
    taintednetes.io/likes: "NODE_A NODE_B"
spec:
  schedulerName: taintednetes
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests: {cpu: 100m, memory: 16Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: db
  annotations:
    taintednetes.io/likes: "NODE_A"
spec:
  schedulerName: taintednetes
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests: {cpu: 100m, memory: 16Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: cache
  annotations:
    taintednetes.io/likes: "NODE_B NODE_A"
spec:
  schedulerName: taintednetes
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests: {cpu: 100m, memory: 16Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowd
spec:
  replicas: 4
  selector:
    matchLabels: {app: crowd}
  template:
    metadata:
      labels: {app: crowd}
    spec:
      schedulerName: taintednetes
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 100m, memory: 16Mi}
