apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-hello
data:
  greeting: {{ .Values.greeting | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-hello
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-hello}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-hello}
    spec:
      containers:
        - name: hello
          image: {{ .Values.image | quote }}
          command: [sh, -c, 'while true; do sleep 3600; done']
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
