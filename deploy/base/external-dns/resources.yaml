apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: amaenetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amaenetes-external-dns
rules:
- apiGroups:
  - ''
  resources:
  - services
  verbs:
  - get
  - list
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amaenetes-external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: amaenetes-external-dns
subjects:
- kind: ServiceAccount
  name: external-dns
  namespace: amaenetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-dns
  namespace: amaenetes
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  resourceNames:
  - external-dns
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-dns
  namespace: amaenetes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-dns
subjects:
- kind: ServiceAccount
  name: external-dns
  namespace: amaenetes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amaenetes-external-dns
  namespace: amaenetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amaenetes-external-dns
  template:
    metadata:
      labels:
        app: amaenetes-external-dns
    spec:
      serviceAccountName: external-dns
      containers:
      - name: external-dns
        image: ghcr.io/tym83/amae:latest
        imagePullPolicy: Always
        command:
        - /opt/amae/bin/external-dns
        - --patience=0
        env:
        - name: KUBECONFIG
          value: /etc/amaenetes/config
        - name: KUBE_CONTEXT
          value: in-cluster
        - name: PDNS_API_URL
          value: http://powerdns.dns.svc:8081
        - name: PDNS_API_KEY
          valueFrom:
            secretKeyRef:
              name: amaenetes-external-dns
              key: api-key
        - name: PDNS_SERVER_ID
          value: localhost
        - name: EXTERNAL_DNS_DOMAIN_FILTER
          value: example.com
        - name: EXTERNAL_DNS_OWNER_ID
          value: amaenetes
        - name: EXTERNAL_DNS_POLICY
          value: sync
        - name: EXTERNAL_DNS_INTERVAL
          value: '30'
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: kubeconfig
          mountPath: /etc/amaenetes
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: kubeconfig
        configMap:
          name: amaenetes-kubeconfig
