apiVersion: v1
kind: ServiceAccount
metadata:
  name: acme
  namespace: amaenetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amaenetes-acme
rules:
- apiGroups:
  - acme.amae.io
  resources:
  - issuers
  - certificates
  - orders
  - challenges
  verbs:
  - get
  - list
  - create
  - patch
- apiGroups:
  - acme.amae.io
  resources:
  - issuers/status
  - certificates/status
  - orders/status
  - challenges/status
  verbs:
  - get
  - patch
- apiGroups:
  - ''
  resources:
  - secrets
  - configmaps
  - services
  verbs:
  - get
  - create
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - create
  - patch
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  resourceNames:
  - acme
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amaenetes-acme
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: amaenetes-acme
subjects:
- kind: ServiceAccount
  name: acme
  namespace: amaenetes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amaenetes-acme
  namespace: amaenetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amaenetes-acme
  template:
    metadata:
      labels:
        app: amaenetes-acme
    spec:
      serviceAccountName: acme
      containers:
      - name: acme
        image: ghcr.io/tym83/amae:latest
        imagePullPolicy: Always
        command:
        - /opt/amae/bin/acme
        - --patience=0
        env:
        - name: KUBECONFIG
          value: /etc/amaenetes/config
        - name: KUBE_CONTEXT
          value: in-cluster
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: kubeconfig
          mountPath: /etc/amaenetes
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: kubeconfig
        configMap:
          name: amaenetes-kubeconfig
