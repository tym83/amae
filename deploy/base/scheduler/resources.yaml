apiVersion: v1
kind: ServiceAccount
metadata:
  name: scheduler
  namespace: amaenetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amaenetes-scheduler
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - nodes
  - namespaces
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - bindings
  - pods/binding
  verbs:
  - create
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - amae.io
  resources:
  - relationships
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - ''
  resources:
  - pods/status
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amaenetes-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: amaenetes-scheduler
subjects:
- kind: ServiceAccount
  name: scheduler
  namespace: amaenetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: amaenetes-scheduler-lease
  namespace: amaenetes
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  resourceNames:
  - amaenetes
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: amaenetes-scheduler-lease
  namespace: amaenetes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: amaenetes-scheduler-lease
subjects:
- kind: ServiceAccount
  name: scheduler
  namespace: amaenetes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: amaenetes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amaenetes-scheduler
  template:
    metadata:
      labels:
        app: amaenetes-scheduler
    spec:
      serviceAccountName: scheduler
      priorityClassName: system-cluster-critical
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: amaenetes-scheduler
      containers:
      - name: scheduler
        image: ghcr.io/tym83/amae:latest
        imagePullPolicy: Always
        command:
        - /opt/amae/bin/amaenetes
        - --patience=0
        env:
        - name: KUBECONFIG
          value: /etc/amaenetes/config
        - name: KUBE_CONTEXT
          value: in-cluster
        - name: AMAENETES_INTERVAL
          value: '5'
        - name: AMAENETES_LEASE
          value: amaenetes/amaenetes
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: kubeconfig
          mountPath: /etc/amaenetes
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: kubeconfig
        configMap:
          name: amaenetes-kubeconfig
