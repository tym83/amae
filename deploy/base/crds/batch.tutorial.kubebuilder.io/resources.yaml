apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cronjobs.batch.tutorial.kubebuilder.io
spec:
  group: batch.tutorial.kubebuilder.io
  scope: Namespaced
  names:
    plural: cronjobs
    singular: cronjob
    kind: CronJob
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - schedule
            - jobTemplate
            properties:
              schedule:
                type: string
                minLength: 1
              startingDeadlineSeconds:
                type: integer
                format: int64
                minimum: 0
              concurrencyPolicy:
                type: string
                enum:
                - Allow
                - Forbid
                - Replace
                default: Allow
              suspend:
                type: boolean
              jobTemplate:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              successfulJobsHistoryLimit:
                type: integer
                format: int32
                minimum: 0
                default: 3
              failedJobsHistoryLimit:
                type: integer
                format: int32
                minimum: 0
                default: 1
          status:
            type: object
            properties:
              active:
                type: array
                items:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    namespace:
                      type: string
                    name:
                      type: string
                    uid:
                      type: string
                    resourceVersion:
                      type: string
                    fieldPath:
                      type: string
              lastScheduleTime:
                type: string
                format: date-time
