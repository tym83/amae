apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: relationships.amae.io
spec:
  group: amae.io
  scope: Namespaced
  names:
    plural: relationships
    singular: relationship
    kind: Relationship
    shortNames:
    - rel
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Partner
      type: string
      jsonPath: .spec.partner.name
    - name: Node
      type: string
      jsonPath: .spec.node
    - name: Resolution
      type: string
      jsonPath: .status.resolution
    - name: Health
      type: string
      jsonPath: .status.health
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Ratio
      type: string
      jsonPath: .status.ratio
    - name: Towards
      type: integer
      jsonPath: .status.turning
    - name: Scars
      type: integer
      jsonPath: .status.scars
    - name: Seen
      type: date
      jsonPath: .status.lastSeen
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            anyOf:
            - required:
              - partner
              - node
            - required:
              - kind
              - between
              - over
              properties:
                kind:
                  enum:
                  - quarrel
            properties:
              kind:
                type: string
              between:
                type: array
                items:
                  type: string
              over:
                type: string
              partner:
                type: object
                properties:
                  kind:
                    type: string
                  name:
                    type: string
              node:
                type: string
          status:
            type: object
            properties:
              resolution:
                type: string
                enum:
                - open
                - consent
                - yielded
                - parted
              swaps:
                type: integer
              owner:
                type: string
              phase:
                type: string
                enum:
                - lust
                - attraction
                - attachment
              language:
                type: string
                enum:
                - ''
                - words
                - time
                - gifts
                - service
                - touch
              spokenLanguages:
                type: array
                items:
                  type: string
              positive:
                type: number
              criticism:
                type: number
              contempt:
                type: number
              defensiveness:
                type: number
              stonewalling:
                type: number
              bids:
                type: number
              towards:
                type: number
              away:
                type: number
              against:
                type: number
              turning:
                type: integer
              scars:
                type: integer
              ratio:
                type: string
              health:
                type: string
                enum:
                - stable
                - at risk
                - failing
              lastSeen:
                type: string
                format: date-time
              history:
                type: array
                items:
                  type: object
                  properties:
                    at:
                      type: string
                    what:
                      type: string
              pods:
                type: object
                x-kubernetes-preserve-unknown-fields: true
