apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: amaenetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amaenetes-postgres
rules:
- apiGroups:
  - postgres.amae.io
  resources:
  - clusters
  - clusters/status
  verbs:
  - get
  - list
  - patch
- apiGroups:
  - postgres.amae.io
  resources:
  - clusters/finalizers
  verbs:
  - update
- apiGroups:
  - ''
  resources:
  - pods
  - secrets
  - services
  verbs:
  - get
  - list
  - create
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - pods/exec
  verbs:
  - create
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amaenetes-postgres
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: amaenetes-postgres
subjects:
- kind: ServiceAccount
  name: postgres
  namespace: amaenetes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres
  namespace: amaenetes
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  resourceNames:
  - postgres
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres
  namespace: amaenetes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres
subjects:
- kind: ServiceAccount
  name: postgres
  namespace: amaenetes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amaenetes-postgres
  namespace: amaenetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amaenetes-postgres
  template:
    metadata:
      labels:
        app: amaenetes-postgres
    spec:
      serviceAccountName: postgres
      containers:
      - name: postgres
        image: ghcr.io/tym83/amae:latest
        imagePullPolicy: Always
        command:
        - /opt/amae/bin/postgres
        - --patience=0
        env:
        - name: KUBECONFIG
          value: /etc/amaenetes/config
        - name: KUBE_CONTEXT
          value: in-cluster
        - name: PG_FAILOVER_DELAY
          value: '10'
        - name: PG_LEASE_NAMESPACE
          value: amaenetes
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: kubeconfig
          mountPath: /etc/amaenetes
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: kubeconfig
        configMap:
          name: amaenetes-kubeconfig
